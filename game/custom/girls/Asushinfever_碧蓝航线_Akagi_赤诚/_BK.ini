often = [ "Yandere",  "Bimbo", ]
rarely = []
never = [ "Stubborn",  "Schemer",  "Helper",  "Holy",  "Meek",  "Tsundere", ]

## 克隆设置 ##
keep_personality = True #如果为True，克隆人将与本体共用个性设置


[custom personality] 
 
## Custom Personality Settings ##
## You may include a custom personality for your girl. This will override the 'Base personality' settings.
## This requires the inclusion of an .rpy file in your girl pack with her dialogue lines 

custom_personality = False # set to True to use a custom personality. This will override the 'Base personality' settings.
personality_name = "" # give a name to the personality (warning: using an existing personality name will override that personality)
description = "" # this text will display in the magic notebook when a girl's personality is known
attributes = ("","") # list a pair of attributes the personality will always have (warning: having more than 2 will cause bugs).
dialogue_personality_weight = 3 # # how much weight personality-based lines will be given compared to attribute-based and generic dialogue
dialogue_attribute_weight = 1 # # how much weight attribute-based lines will be given compared to personality-based and generic dialogue
generic_dialogue = True # Disabled, but included here for future-proofing. Bool, decides if this personality allows for generic dialogue or not. Custom dialogue should be provided for all relevant situations if set to False.
personality_dialogue_only = None # A list of topics (with quotes, between [] brackets) for which only personality-based dialogue is allowed (e.g. ["slave first visit", "slave train beg"]). All topics can be found in BKdialogue.rpy

custom_dialogue_label = "" # For more complex custom dialogue, a label can be specified. It will receive the 'girl' object and the dialogue 'topic' as arguments.


