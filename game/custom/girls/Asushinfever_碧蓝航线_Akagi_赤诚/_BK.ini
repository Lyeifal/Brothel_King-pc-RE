#### Akagi - 用标签工具生成的适用于青楼之王0.3版本的BK.ini  #### 

## 这个可选文件包含一个特定女孩的高级配置数据。不需要的变量可以删除。 
## 该文件应该命名为“_BK.ini”，并放在相关的girl文件夹中。 
## 整行注释是用双哈希引入的 (##) 
## 使用散列（#）或分号添加同一行注释 (;) 
## 注释: 克隆选项现在是每个选项的一部分，但是仍然支持带有专用[cloning options]部分的遗留格式。 


[identity] 
 
## 角色姓名 ## 
 
first_name = "Akagi" # 如果没有或为空，名字将被随机化 
last_name = "" # 如果没有或为空，她将没有姓氏 
inverted_name = False #如果为True， 全名将显示姓氏在名字之前，例如： 'Spears Britney'。 

## 女孩包数据 ## 
 
creator = "Asushinfever" 
version = "v1.0" # 版本号显示在女孩包的浏览界面，这可以帮助玩家了解你的女孩包是何时更新的。您可以使用您喜欢的任何版本号命名格式。
description = "" # 描述将显示在女孩包的浏览界面。

## 克隆设置 ## 
## 这些选项定义了原始女孩的“克隆体”在生成时的设置。 
## 在一局游戏中只能有一个原始女孩，以及任意数量的克隆人。 

unique = False ##如果为True， 克隆人不会生成，只有本体的女孩。所有其他克隆选项将不起作用。 
keep_first_name = True #如果为True， 克隆人将与本体保持相同的名字
keep_last_name = True #如果为True， 克隆人将与本体保持相同的姓氏
keep_inverted = True #如果为True， 克隆人将遵循您为本体设置的姓名顺序

[base skills] 
 
## 女孩的属性 ##
## 属性评级由1到5 (1 代表很糟糕, 3 代表平均水平, 5 代表远超常人。 游戏内还会产生一些变化。) 
## 对于想要随机生成的属性，跳过设置或将其设置为0 
## 外貌: 影响按摩技师和性交的表现
身材: 影响脱衣舞娘和肛交的表现
魅力: 影响女服务员和侍奉的表现
优雅: 影响表演艺妓和调教的表现
敏感: 影响侍奉和客人的满意度
性欲: 影响性交和接客人数
体质: 影响肛交和精力上限
服从: 影响调教和服从性 
 
beauty = 5
body = 5
charm = 5
refinement = 4
libido = 5
obedience = 2
constitution = 3
sensitivity = 3

## 克隆设置 ##
keep_skills = True # 如果为True, 克隆人将与本体共用一套属性设置



[base positive traits] 
 
## 一个女孩在游戏中只能有2个正面特质。金色特质也视为正面特质。 
## Trait names must be between quotes (), spelled exactly as they are in-game. See BKtraits.rpy for the full list of trait names. 
 
## 女孩将永远具有这些特质（最多nb个特质）。谨慎使用，这会让随机生成的女孩失去神秘感。 
always = [] 
 
## 女孩更容易拥有这些特质。
often = [] 
 
## 女孩更难拥有这些特质。 
rarely = [] 
 
## 女孩无法拥有这些特质。 
never = [ "Loose",  "Rowdy",  "Thief",  "Meek", ] 
 
 
[base negative traits] 
 
## 女孩将永远具有这些特质（最多nb个特质）。谨慎使用，这会让随机生成的女孩失去神秘感。 
always = [] 
 
## 女孩更容易拥有这些特质。 
often = [] 
 
## 女孩更难拥有这些特质。 
rarely = [] 
 
## 女孩无法拥有这些特质。 
never = [ "Square",  "Scruffy",  "Awkward",  "Plain",  "Jaded",  "Homely",  "Rude",  "Oafish",  "Frail",  "Timid",  "Vulnerable", ] 
 
## 克隆设置 ##
keep_traits = False #如果为True，克隆人将与本体共用特质设置


[base personality] 
 
## 个性设置 ##
## 游戏中有24种个性类型: pervert, rebel, cold, nerd, masochist, masochist2, meek, sweet, superficial, bimbo, holy, helper, creep, repressed, schemer, prude, princess, pet, easy, class president, tsundere, loyal, yandere, stubborn
## 一个女孩只能有一种个性。浏览BKinit_variables.rpy中的'gpersonalities'获取详细的个性介绍。

