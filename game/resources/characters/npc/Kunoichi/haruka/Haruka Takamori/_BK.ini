#### HARUKA TAKAMORI ####

## This optional file contains advanced config data about a particular girl. Variables you don't need can be deleted or set to 0
## Full line comments are introduced with a double hash (##)
## Same line comments must be added using a semi-colon sign (;)

[identity]

first_name = "Haruka" ; If absent or empty, first name will be randomized
last_name = "Takamori" ; If absent or empty, no last name will be used
inverted_name = False ; If True, the full name will display the last name before the first name, e.g.: 'Boa Hancock'


[base skills]

## Rank starting skills from 1 to 5 (1 is terrible, 3 is average, 5 is superb. The game will add some variation.)
## Set value to 0 for a randomized skill level

Beauty = 4
Body = 5
Charm = 3
Refinement = 2
Libido = 2
Obedience = 4
Constitution = 5
Sensitivity = 3


[base positive traits]

## Reminder, a girl may only have 2 positive traits. Traits will be generated with average frequency if not specified below.
## Trait names must be between quotes. See BKstart.rpy for the list of trait names.

## the girl will ALWAYS have these traits (up to maximum nb of traits). Use with caution as it makes girl generation very predictable.
always = ["stalwart", "driven"]

## The girl will more often have these traits than standard girls.
often = []

## The girl will less often have these traits than standard girls.
rarely = []

## The girl will NEVER have these traits.
never = []


[base negative traits]

## Reminder, a girl may only have 1 negative trait. Traits will be generated with average frequency if not specified below.
## Trait names must be between quotes. See BKstart.rpy for the list of trait names.

## the girl will ALWAYS have these traits (up to maximum nb of traits). Use with caution as it makes girl generation very predictable.
always = ["earthbound"]

## The girl will more often have these traits than standard girls.
often = []

## The girl will less often have these traits than standard girls.
rarely = []

## The girl will NEVER have these traits.
never = []


[base personality]

## There are 24 personality types in the game. You can add a custom one.
## A girl can have only one personality.

always = ["class president"] ; Use with care: it makes girl generation very predictable.
often = []
rarely = []
never = []


[custom personality]

## You can set a custom personality for the girl here. This will override the 'Base personality' settings
## See 'gpersonalities' in BKinit_variables.rpy for examples of game personalities

custom_personality = False ; set to True to use a custom personality. This will override the 'Base personality' settings.
name = "sample personality" ; give a name to that personality (warning: using an existing personality name will override that personality)
attributes = () ; list attributes the personality will always have (warning: having more than 2 will cause bugs).
personality_dialogue_only = False ; if set to False, no generic or attribute-based dialogue will be used for this girl (make sure to provide the proper dialogue in a separate file using the 'add_dialogue' function in an init block)
dialogue_personality_weight=3 ; how much weight personality-based lines will be given compared to attribute-based and generic dialogue
dialogue_attribute_weight=1 ; how much weight attribute-based lines will be given compared to personality-based and generic dialogue
description="" ; this text will display in the magic notebook when a girl's personality is known
custom_dialogue_label=None ; if provided (as a string, between quotes), refers to a custom label that can be called by a mod with the Girl 'say' method


[sexual preferences]

## Rank skills from 1 to 5 (1 is terrible, 3 is average, 5 is superb. The game may add some variation.)
## Set value to 0 for a randomized skill level

naked = 2
service = 2
sex = 2
anal = 3
fetish = 4
bisexual = 1
group = 3

farm_weakness = "beast" ; choose between the following values: stallion, beast, monster, machine, random (use quotation marks)

## You can choose positive or negative fixations which will be generated more often for this girl.
favorite_fixations = ["bondage"]
disliked_fixations = []


[background story]

## Restrictions for girl generation
generate_as = "story" ; Can be set to 'all' or restricted to 'story', 'free' or 'slave' (the girl will then generate only as a free girl or slave)

## You can provide a custom origin or just "random" (if you do, make sure to include the origin description below)
origin = "Borgo" 

## Origin description must be written in the girl's own words (first person)
origin_description = "I come from the outskirsts of Borgo, the Port city. I was an orphan, so Subaru of the Earth School took me in from a young age. She's all the family I ever had."

## If provided, this label will be called instead of normal city interactions. It must take 'girl' as an argument.
## The regular dialog options can be called from within this custom label by using the line: 'call free_girl_interact(girl)'
city_label = None ; Only provide the custom label name (between quotes)

## If provided, this label will be called instead of a random back-story. It must take 'girl' as an argument.
## See the 'slave_story' labels in BKinteractions.rpy for examples of how it might work (feel free to set up the events very differently)
story_label = "empty_girl_story" ; Only provide the custom label name (between quotes)


[cloning options]
## Thoses options define how 'clones' of the original girl behave at generation. There can be only one original girl at once in the game.

unique = True

keep_first_name = False ; If True, clones will keep the same first name
keep_last_name = False ; If True, clones will keep the same last name
keep_inverted = False ; If True, clones will keep the same options for inverted names

keep_skills = False ; If True, clones will keep the same base skill repartition
keep_traits = False ; If True, clones will keep the same base trait options
keep_personality = False ; If True, clones will keep the same base personality options
keep_custom_personality = False ; If True, clones will keep the same custom personality
keep_sex = False ; If True, clones will keep the same sexual preferences
keep_generate_as = False ; If False, clones will be generated both as slave and free girls regardless of the original setting
keep_background = False ; If True, clones will keep the same background story and city options


